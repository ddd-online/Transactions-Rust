[package]
name = "tr-draw"
version.workspace = true
edition.workspace = true
license.workspace = true

# 界面侧的纯算法层：绘制（坐标与刻度 / SVG 定点改写 / 提示框定位 / 裁剪几何）
# 与取数决策核心。
#
# 为什么单开一个 crate（而不是塞进 tr-domain、也不把 tr-ui 改成双目标）：
# 见 docs/adr/0001-pure-draw-crate.md。
#
# 两条纪律：
# * native 与 wasm32 两种目标都要能编 —— 不许出现 web-sys / leptos / charts-rs。
# * 本 crate 是这些算法**唯一的测试面**：`cargo test -p tr-draw`。
[dependencies]
# HEIC/HEIF → RGBA8。核是 no_std + alloc、零 I/O（`io` 模块在默认特性里，已关掉），
# 所以本 crate 的两条纪律（双可编、零 I/O）都不破。
heic-rs = { workspace = true }

[dev-dependencies]
# 只给测试用：读 `flat-64.ref.png` 当参照物（见 fixtures/heic/README.md）。
png = "0.17"
