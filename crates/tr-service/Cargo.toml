[package]
name = "tr-service"
version.workspace = true
edition.workspace = true
license.workspace = true

# 服务层：业务规则。对照原 Go 版 `kernel/service/*`。
# 依赖 tr-store（数据）+ tr-domain（模型与纯算法），**不依赖 tauri**（保证 headless 可测）。
[dependencies]
tr-domain = { workspace = true }
tr-store = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
# 日记导入的编码回退链（UTF-8 → UTF-16 → GBK），对照 Go 的 golang.org/x/text
encoding_rs = "0.8"
# 关键事件图片：base64 解码 + 解码/缩放/JPEG 编码（缩略图）
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
# 日期换算：复刻 Go 的 time.Parse/time.Format 与 strftime(unixepoch) 语义
chrono = "0.4"
serde_json = "1.0.151"
