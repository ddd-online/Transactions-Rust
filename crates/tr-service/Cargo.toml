[package]
name = "tr-service"
version.workspace = true
edition.workspace = true
license.workspace = true

# 服务层：业务规则（账本 / 交易 / 分类 / 标签 / 模板 / 图表 / 日记 / 股票）。
# 依赖 tr-store（数据）+ tr-domain（模型与纯算法），**不依赖 tauri**（保证 headless 可测）。
[dependencies]
tr-domain = { workspace = true }
tr-store = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
# 日记导入的编码回退链（UTF-8 → UTF-16 → GBK）
encoding_rs = "0.8"
# 关键事件图片：base64 解码 + 解码/缩放/JPEG 编码（缩略图）
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
# 日期换算：严格的日期/月份解析 + `unix_to_date`（股票域按**宿主本地时区**取日期，
# 与界面 `time::format_timestamp` 同口径 —— 见 stock.rs 的注释；默认 features 带 `clock`，`Local` 就是它）
chrono = "0.4"
serde_json = "1.0.151"

# Windows 系统代理探测（「Internet 选项」的 ProxyEnable/ProxyServer，只读）。
# 非 Windows 上不编译这段代码，也不需要这个依赖。
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
