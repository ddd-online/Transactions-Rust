[package]
name = "tr-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# 界面层：Leptos CSR（Rust → WASM），由 trunk 构建。
#
# 为什么依赖挂在 `cfg(target_arch = "wasm32")` 下：本 crate 是纯界面，
# 只为 wasm32 编译。这样 native 侧 `cargo check --workspace` 不会被 web-sys/leptos 拖慢，
# 也不会把界面依赖带进桌面二进制。
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tr-domain = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
# 折线图引擎：纯 Rust 出 SVG（默认特性为 0；raster/image-encoder 才会拉 image + resvg）
charts-rs = { version = "1.0", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "CustomEvent",
    "DataTransfer",
    "DomRect",
    "NodeList",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "ImageBitmap",
    "MediaQueryList",
    "Node",
    "Url",
    "Window",
    "console",
] }
