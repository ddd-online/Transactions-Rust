[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

# 构建/验证辅助工具（非发布产物）：
# * `schema-diff` —— 校验 Rust 建库结果与 Go 0.27 建库结果完全一致（数据兼容护栏）
# * `parity`      —— 68 个操作的黄金对比（P2 阶段接入）
[dependencies]
tr-domain = { workspace = true }
tr-store = { workspace = true }
tr-service = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
